name: Deploy Val (production)

on:
  push:
    branches: [production]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-val-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy to val.hyprtask.ai
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VAL_SSH_HOST }}
          username: ${{ secrets.VAL_SSH_USER }}
          key: ${{ secrets.VAL_SSH_PRIVATE_KEY }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd /opt/dograh
            git fetch origin
            git checkout production
            git reset --hard origin/production
            git submodule update --init --recursive
            # Write .env + org prefs before rebuild so the new stack picks them up.
            bash ./scripts/enable_val_production_features.sh --skip-restart
            ./remote_up.sh --build
            if command -v jq >/dev/null 2>&1; then
              curl -fsS http://127.0.0.1:8000/api/v1/health | jq '{status, version}'
            else
              curl -fsS http://127.0.0.1:8000/api/v1/health
            fi
